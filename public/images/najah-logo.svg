<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" fill="none" role="img" aria-label="شعار جامعة النجاح الوطنية الرسمي">
  <!-- University Blue Background / Base shape -->
  <rect width="450" height="110" rx="10" fill="#002B49" />
  
  <!-- Crest Icon Graphic -->
  <g transform="translate(25, 20)">
    <circle cx="35" cy="35" r="32" fill="#00A3E0" fill-opacity="0.15" stroke="#00A3E0" stroke-width="2.5" />
    <!-- Book & Torch / Arch Representation -->
    <path d="M20 48 C 28 42, 35 44, 35 44 C 35 44, 42 42, 50 48 L 50 25 C 42 20, 35 22, 35 22 C 35 22, 28 20, 20 25 Z" fill="#FFFFFF" />
    <path d="M35 15 L 35 44" stroke="#00A3E0" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="35" cy="14" r="3.5" fill="#00A3E0" />
  </g>

  <!-- Typography: Arabic & English Official Brand -->
  <g transform="translate(110, 36)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Cairo', 'Tajawal', 'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="bold">
      جامعة النجاح الوطنية
    </text>
    <text x="0" y="24" fill="#00A3E0" font-family="'Cairo', 'Tajawal', 'Segoe UI', Tahoma, sans-serif" font-size="14" font-weight="600">
      حملة التبرع بالدم المسبقة الرسمية
    </text>
    <text x="0" y="44" fill="#94A3B8" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="1">
      AN-NAJAH NATIONAL UNIVERSITY
    </text>
  </g>
</svg>
