
name: Encrypted Offsite Backup

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual backup trigger reason'
        required: false
        default: 'Manual maintenance backup'

jobs:
  backup:
    name: Execute Encrypted Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Diagnose Supabase Connectivity
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          node <<'NODE'
          const dns = require('node:dns').promises;

          async function main() {
            const rawUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;

            if (!rawUrl) {
              throw new Error('SUPABASE_URL_MISSING');
            }

            const url = new URL(rawUrl);

            if (url.protocol !== 'https:') {
              throw new Error('SUPABASE_URL_NOT_HTTPS');
            }

            console.log('Checking DNS resolution...');

            try {
              const addresses = await dns.lookup(url.hostname, { all: true });
              console.log('DNS OK. Addresses found:', addresses.length);
            } catch (error) {
              console.error('DNS failed:', error.code, error.message);
              process.exitCode = 1;
              return;
            }

            console.log('Checking HTTPS connectivity...');

            try {
              const response = await fetch(
                new URL('/rest/v1/', url),
                { signal: AbortSignal.timeout(15000) }
              );

              console.log('HTTPS connected. Status:', response.status);
              console.log('A 401 or 404 response still confirms HTTPS connectivity.');
            } catch (error) {
              console.error('HTTPS failed:', error.message);
              console.error('Cause code:', error.cause?.code || 'unknown');
              console.error('Cause message:', error.cause?.message || 'unknown');
              process.exitCode = 1;
            }
          }

          main().catch(error => {
            console.error('Diagnostic failed:', error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Run Encrypted Backup Engine
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          mkdir -p backups
          node scripts/backup.js backups

      - name: Archive Encrypted Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-wasel-backups-${{ github.run_id }}
          path: backups/*.enc.json
          retention-days: 7
          if-no-files-found: error
