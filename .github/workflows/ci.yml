name: CI Quality Gates

on:
  push:
    branches:
      - main
      - 'remediation/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Automated Tests (Unit, Integration & Security)
        run: npm test

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_CAMPAIGN_CODE: "ANNU-BLOOD-2026"
          NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy_anon_key_for_build"
          SUPABASE_SERVICE_ROLE_KEY: "dummy_service_role_key_for_build"
          ADMIN_SECRET_KEY: "dummy_admin_secret_key_at_least_32_chars!"
